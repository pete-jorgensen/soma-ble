name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: protocol unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The protocol layer is pure -- no Home Assistant and no Bluetooth -- so it is
      # testable on its own, which is the point of keeping it separate.
      - run: python -m pytest tests -q
