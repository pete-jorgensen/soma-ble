jog:
  target:
    entity:
      integration: soma_ble
      domain: cover
  fields:
    direction:
      required: true
      selector:
        select:
          options:
            - open
            - close
    seconds:
      required: true
      example: 2
      default: 2
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
          unit_of_measurement: s
          mode: box
